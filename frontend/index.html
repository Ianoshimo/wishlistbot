<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WebView Telegram агрессивно кэширует index.html (см. serve.json
         для HTTP-заголовка Cache-Control - основной фикс), это на случай,
         если конкретный движок WebView смотрит на meta-тег. -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Вишлист-бот</title>
    <!-- Редизайн "Электрик" (2026-10-01, согласовано пользователем по
         4 вариантам палитры) - Space Grotesk для заголовков, системный
         шрифт остаётся для текста интерфейса (см. theme.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
