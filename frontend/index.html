<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- WebView Telegram агрессивно кэширует index.html (см. serve.json
         для HTTP-заголовка Cache-Control - основной фикс), это на случай,
         если конкретный движок WebView смотрит на meta-тег. -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Вишлист-бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Диагностика пустого экрана внутри Telegram (2026-10-02): если
      // приложение падает до того, как React успевает что-то отрисовать,
      // пользователь видит голый фон темы и ничего больше - непонятно,
      // в чём дело. Этот блок ничего не меняет в самом приложении, только
      // показывает текст ошибки прямо на экране вместо пустоты.
      window.__bootStarted = false;
      window.__fetchLog = [];
      (function () {
        // Перехватываем fetch ДО того, как main.tsx вообще загрузится -
        // единственный надёжный способ увидеть, попыталось ли приложение
        // вообще достучаться до API, независимо от того, что говорит
        // Performance API (там не видно ещё не завершившихся запросов).
        var originalFetch = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && input.url;
          var entry = { url: url, startedAt: Date.now(), status: "pending" };
          window.__fetchLog.push(entry);
          return originalFetch.apply(this, arguments).then(
            function (res) {
              entry.status = res.status;
              entry.ms = Date.now() - entry.startedAt;
              return res;
            },
            function (err) {
              entry.status = "error: " + (err && err.message);
              entry.ms = Date.now() - entry.startedAt;
              throw err;
            },
          );
        };

        var errors = [];
        function report(msg) {
          errors.push(String(msg));
        }
        // true в третьем аргументе - фаза перехвата: только так ловятся
        // ошибки ЗАГРУЗКИ ресурсов (скрипт/стиль не скачался), в отличие
        // от ошибок ВЫПОЛНЕНИЯ кода - первый прогон диагностики их не видел
        // именно поэтому.
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target !== window) {
              report("Ресурс не загрузился: " + (e.target.src || e.target.href || e.target.tagName));
            } else {
              report((e.error && e.error.stack) || e.message);
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          report((e.reason && e.reason.stack) || e.reason);
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childNodes.length > 0) return;
          var tg = window.Telegram && window.Telegram.WebApp;
          var scripts = performance
            .getEntriesByType("resource")
            .filter(function (r) {
              return /\.(js|css)$/.test(r.name);
            })
            .map(function (r) {
              return r.name.split("/").pop() + ": " + (r.transferSize || 0) + " байт, " + Math.round(r.duration) + "мс";
            });
          var fetches = window.__fetchLog
            .map(function (f) {
              return f.url + " -> " + f.status + (f.ms != null ? " (" + f.ms + "мс)" : " (ещё не завершился)");
            })
            .join("\n");
          var info = [
            "Экран пуст - диагностика:",
            "Бандл начал выполняться: " + window.__bootStarted,
            "location.hash: " + location.hash,
            "start_param: " + (tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : "-"),
            "initData есть: " + (tg ? String(!!tg.initData) : "Telegram.WebApp нет"),
            "UA: " + navigator.userAgent,
            "Ресурсы (js/css):\n" + (scripts.length ? scripts.join("\n") : "ни одного не замечено performance API"),
            "fetch-запросы:\n" + (fetches || "ни одного fetch не было вызвано вообще"),
            errors.length ? "Ошибки:\n" + errors.join("\n---\n") : "Ошибок не поймано",
          ].join("\n\n");
          var pre = document.createElement("pre");
          pre.style.cssText =
            "padding:16px;margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#fff;background:#111;min-height:100vh;box-sizing:border-box;";
          pre.textContent = info;
          document.body.appendChild(pre);
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
